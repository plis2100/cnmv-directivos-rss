name: Actualizar directivos CNMV

on:
  workflow_dispatch:

  schedule:
    # Cada dos horas, todos los días.
    # GitHub Actions utiliza horario UTC.
    - cron: "23 */2 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-directivos-cnmv
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear RSS
        run: |
          python actualizar_rss.py

          echo "Archivos existentes:"
          ls -la

          if [ ! -f feed.xml ]; then
            echo "ERROR: no se ha creado feed.xml"
            exit 1
          fi

          if [ ! -s feed.xml ]; then
            echo "ERROR: feed.xml está vacío"
            exit 1
          fi

      - name: Comprobar RSS
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          archivo = Path("feed.xml")
          raiz = ET.parse(archivo).getroot()
          entradas = raiz.findall("./channel/item")

          print("RSS XML correcto.")
          print(f"Tamaño: {archivo.stat().st_size} bytes")
          print(f"Entradas encontradas: {len(entradas)}")

          if entradas:
              print("Primera entrada:")
              print(entradas[0].findtext("title"))
          else:
              print(
                  "El RSS es correcto, aunque todavía "
                  "no contiene notificaciones."
              )
          PY

      - name: Guardar RSS actualizado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml historial.json

          if git diff --cached --quiet; then
            echo "No hay notificaciones nuevas."
          else
            git commit -m "Actualizar directivos CNMV"
            git push
          fi
